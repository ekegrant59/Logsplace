<!DOCTYPE html><html lang="en" x-data="{ darkMode: localStorage.getItem('dark') === 'true' }" x-init="$watch('darkMode', val => localStorage.setItem('dark', val))" :class="{ 'dark': darkMode }"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Logsplace</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
 <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- AlpineJS for dark mode -->
    <script src="js/cdn.min.js" defer=""></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        orange: {
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md space-y-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 sm:p-8">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-orange-700 dark:text-orange-400">Signup</h1>
            <!--<p class="text-sm text-gray-500 dark:text-gray-400">Login to your account</p>-->
            {% if messages %}
            {% for m in messages %}
            <p class="text-sm text-gray-500 dark:text-gray-400">{{ m }}</p>
            {% endfor %}
            {% endif %}
        </div>

        <!-- Session Status -->
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <!-- Email -->
    <!-- Email or Username -->
<div>
    <label for="email" class="block text-sm font-medium">Username</label>
    <input type="text" name="username" id="email" value="" required="" autofocus="" class="mt-1 w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-orange-500 focus:border-orange-500">
    </div>
    
    <div>
    <label for="email" class="block text-sm font-medium">Email</label>
    <input type="text" name="email" id="email" value="" required="" autofocus="" class="mt-1 w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-orange-500 focus:border-orange-500">
    </div>


            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium">Password</label>
                <input type="password" name="password" id="password" required="" autocomplete="current-password" class="mt-1 w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-orange-500 focus:border-orange-500">
                            </div>
                            
            <div>
                <label for="password" class="block text-sm font-medium">Password</label>
                <input type="password" name="password_confirmation" id="password" required="" autocomplete="current-password" class="mt-1 w-full px-3 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-orange-500 focus:border-orange-500">
                            </div>

            <!-- Remember Me & Forgot -->

            <!-- Submit -->
            <div>
                <div class="g-recaptcha" data-sitekey="6LcNfWwrAAAAABcOIIrIX8AyysDSE6_KUxvPf_3B"></div>
                                        <script src="https://www.google.com/recaptcha/api.js" async defer></script>
                <button type="submit" class="w-full py-2 px-4 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-md shadow-md transition">
                    Signup
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                Already have an account?
                <a href="https://logsplace.com/user/signin/" class="text-orange-600 hover:underline dark:text-orange-400">Login</a>
            </p>
        </div>
    </div>
<script>
    
    
    </script>


</body></html>
