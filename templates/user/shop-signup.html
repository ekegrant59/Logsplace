<script type="text/javascript">
$("#btnRegister").on("click", function() {
    $('#btnRegister').html('<i class="fa fa-spinner fa-spin"></i> Processing...').prop('disabled',
        true);
    $.ajax({
        url: "https://logsplace.com/user/signup-ajax/",
        // method: "POST",
        // dataType: "JSON",
        data: {
            username: $("#username").val(),
            email: $("#email").val(),
            password: $("#password").val(),
            repassword: $("#repassword").val(),
        },
        success: function(respone) {
            if (respone.user === true || respone.email === true) {
                cuteToast({
                    type: "success",

                    timer: 5000
                });
                setTimeout("location.href = 'https://logsplace.com/user/signin/';", 100);
            } else if (respone.user == false || response.email === false) {
                Swal.fire(

                );
                $('#btnRegister').html('Register').prop('disabled', false);
                // setTimeout("location.href = 'https://logsplace.com/user/signup/';", 1000);
            } else {
                Swal.fire(
