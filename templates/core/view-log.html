{% load humanize %}
<style>
    .buy-button {
        padding: 10px 20px;
        background-color: #007BFF;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .buy-button:hover {
        background-color: #0056b3;
    }

    .popup-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1;
    }

    .popup-content {
        background: #fff;
        width: 300px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .popup-header {
        background: #007BFF;
        padding: 15px;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .popup-header h2 {
        margin: 0;
    }

    .close-button {
        cursor: pointer;
    }

    .popup-body {
        padding: 20px;
    }

    .popup-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
    }

    #gateway-select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    .popup-footer {
        padding: 15px;
        background: #007BFF;
        text-align: center;
    }

    .payment-button {
        background: #fff;
        color: #007BFF;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
    }

    .payment-button:hover {
        background: #f1f1f1;
    }
    .copy_clip {
        color: white; 
        background: blue; 
        border-radius: 10px; 
        padding: 10px;
    }
    </style>

<div id="popup" class="popup-content">
    <div class="popup-header">
        <h2>View Log</h2>
        <span class="close-button" id="close_view_log" onclick="closePopup()">&times;</span>
    </div>
    <div class="popup-body">
        {% for p in items %}
        <div class="all_body">
            <div class="popup-row" style="display: block;">
                <span>Log Name:</span>
                <p>{{ p.log.log }}</p>
            </div>
            <div class="popup-row" style="display: block;">
                <span>Log Details:</span>
                <p class="logs" style="width: 250px; word-wrap: break-word; text-align: center; overflow-x: auto; min-height: 100px; max-height: 250px;">{{ p.log.info }}</p>
            </div>
        </div>
        <div class="popup-row" style="justify-content: center; align-content: center;">
            <span style="text-align: center; font-weight: bold;">Amount: ₦{{ p.log.amount|floatformat:2|intcomma }}</span>
            <br>
        </div>
        {% endfor %}
        <div class="copything">
            <button class="copy_clip" id="copyButton">Copy Log</button>
        </div>
    </div>
    <div class="popup-footer">
        <button id="close_view_log" onclick="closePopup()" class="payment-button">Close</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
        $(document).ready(function() {
            $('#copyButton').click(function() {
                // Select the text content of the logs div
                var content = $('.logs').text();
                
                // Create a temporary textarea element to hold the content
                var $temp = $('<textarea>');
                $('body').append($temp);
                $temp.val(content).select();
                
                // Execute the copy command
                document.execCommand('copy');
                
                // Remove the temporary textarea
                $temp.remove();
                
                alert('Logs content copied to clipboard!');
            });
        });
</script>

<script>
    // Function to show the popup
    function showPopup() {
        document.getElementById('popup').style.display = 'flex';
    }

    // Function to close the popup
    function closePopup() {
        document.getElementById('popup').style.display = 'none';
    }
</script>
