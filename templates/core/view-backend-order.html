<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basedlogs Backend</title>
    <!-- ======= Styles ====== -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <!-- =============== Navigation ================ -->
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="https://basedlogs.com/">
                        <span class="icon">
                            <ion-icon name="logo-tumblr"></ion-icon>
                        </span>
                        <span class="title">Basedlogs</span>
                    </a>
                </li>

                <li>
                    <a href="/backend/">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="/backend-category/">
                        <span class="icon">
                            <ion-icon name="cart-outline"></ion-icon>
                        </span>
                        <span class="title">Categories</span>
                    </a>
                </li>
                
                <li>
                    <a href="/backend-log/">
                        <span class="icon">
                            <ion-icon name="cart-outline"></ion-icon>
                        </span>
                        <span class="title">Logs</span>
                    </a>
                </li>
                
                <li>
                    <a href="/backend-orders/">
                        <span class="icon">
                            <ion-icon name="cart-outline"></ion-icon>
                        </span>
                        <span class="title">Orders</span>
                    </a>
                </li>

                <li>
                    <a href="/backend-users/">
                        <span class="icon">
                            <ion-icon name="people-circle-outline"></ion-icon>
                        </span>
                        <span class="title">Users</span>
                    </a>
                </li>
                
                <li>
                    <a href="/backend-wallet/">
                        <span class="icon">
                            <ion-icon name="people-circle-outline"></ion-icon>
                        </span>
                        <span class="title">Wallet</span>
                    </a>
                </li>

                <li>
                    <a href="/admin/">
                        <span class="icon">
                            <ion-icon name="log-in-outline"></ion-icon>
                        </span>
                        <span class="title">Main Backend</span>
                    </a>
                </li>                
            </ul>
        </div>

        <!-- ========================= Main ==================== -->
        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>

                <!-- <div class="search">
                    <label>
                        <input type="text" placeholder="Search here">
                        <ion-icon name="search-outline"></ion-icon>
                    </label>
                </div> -->

                <div class="user">
                    <img src="/assets/imgs/customer01.jpg" alt="">
                </div>
            </div>            

            <!-- ================ Order Details List ================= -->
            <div class="details" style="display: block;">
                <div class="recentOrders">
                    <div class="cardHeader">
                        <h2>Order #{{ u.id }}</h2>                        
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <td>Username</td>
                                <td>Email</td>     
                                <td>Log</td>     
                                <td>Category</td>     
                                <td>Amount</td>     
                                <td>Qty</td>     
                                <td>Info</td>     
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>{{ u.user.username }}</td>
                                <td>{{ u.email }}</td>
                                <td>{{ u.log }}</td>
                                <td>{{ u.category }}</td>
                                <td>{{ u.amount }}</td>
                                <td>{{ u.qty }}</td>
                                <td>{{ u.info }}</td>
                            </tr>  
                        </tbody>
                    </table>
                </div>

                <!-- ================= New Customers ================ -->                
            </div>
        </div>
    </div>

    <!-- =========== Scripts =========  -->
    <script src="/assets/js/main.js"></script>

    <!-- ====== ionicons ======= -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
