<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basedlogs Backend</title>
    <!-- ======= Styles ====== -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <!-- =============== Navigation ================ -->
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="https://basedlogs.com/">
                        <span class="icon">
                            <ion-icon name="logo-tumblr"></ion-icon>
                        </span>
                        <span class="title">Basedlogs</span>
                    </a>
                </li>

                <li>
                    <a href="/backend/">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="/backend-category/">
                        <span class="icon">
                            <ion-icon name="cart-outline"></ion-icon>
                        </span>
                        <span class="title">Categories</span>
                    </a>
                </li>
                
                <li>
                    <a href="/backend-log/">
                        <span class="icon">
                            <ion-icon name="cart-outline"></ion-icon>
                        </span>
                        <span class="title">Logs</span>
                    </a>
                </li>
                
                <li>
                    <a href="/backend-orders/">
                        <span class="icon">
                            <ion-icon name="cart-outline"></ion-icon>
                        </span>
                        <span class="title">Orders</span>
                    </a>
                </li>

                <li>
                    <a href="/backend-users/">
                        <span class="icon">
                            <ion-icon name="people-circle-outline"></ion-icon>
                        </span>
                        <span class="title">Users</span>
                    </a>
                </li>
                
                <li>
                    <a href="/backend-wallet/">
                        <span class="icon">
                            <ion-icon name="people-circle-outline"></ion-icon>
                        </span>
                        <span class="title">Wallet</span>
                    </a>
                </li>

                <li>
                    <a href="/admin/">
                        <span class="icon">
                            <ion-icon name="log-in-outline"></ion-icon>
                        </span>
                        <span class="title">Main Backend</span>
                    </a>
                </li>                
            </ul>
        </div>

        <!-- ========================= Main ==================== -->
        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>

                <!-- <div class="search">
                    <label>
                        <input type="text" placeholder="Search here">
                        <ion-icon name="search-outline"></ion-icon>
                    </label>
                </div> -->

                <div class="user">
                    <img src="/assets/imgs/customer01.jpg" alt="">
                </div>
            </div>            

            <!-- ================ Order Details List ================= -->
            <div class="details" style="display: block;">
                <div class="recentOrders">
                    <div class="cardHeader">
                        <h2>Log #{{ u.id }}</h2>                        
                    </div>

                    <div style="max-width: 500px; margin: 0 auto; padding: 20px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); font-family: Arial, sans-serif; box-sizing: border-box; width: 100%;">
                    <!-- Form Title -->
                    
                    <!-- Form Elements -->
                    <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                        {% csrf_token %}
                        <!-- Name input -->
                        <label for="name" style="font-weight: bold;">Name:</label>
                        <input type="text" id="name" value="{{ u.name }}" name="name" placeholder="Enter your name" required 
                            style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                
                        <!-- Email input -->
                        <label for="email" style="font-weight: bold;">QTY:</label>
                        <input type="number" id="email" name="qty" value="{{ u.qty }}" placeholder="Enter Quantity" required 
                            style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                
                        <!-- Password input -->
                        <label for="password" style="font-weight: bold;">Price:</label>
                        <input type="number" value="{{ u.price }}" id="password" name="price" placeholder="Enter price" required 
                            style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                
                        <!-- Dropdown -->
                        <label for="options" style="font-weight: bold;">Category:</label>
                        <select id="options" name="options" required 
                            style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                            <option value="{{ u.cat.name }}">{{ u.cat.name }}</option>
                            {% for cat in cat %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                
                        <!-- Description textarea -->
                        <label for="description" style="font-weight: bold;">Description:</label>
                        <textarea id="description" name="description" placeholder="Enter a detailed description..." required 
                            style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; height: 100px; resize: vertical; background-color: #2A2185; color: white;">
                            {{ u.description }}
                        </textarea>
                
                        <!-- Submit button -->
                        <button type="submit" 
                            style="padding: 10px; background-color: #2A2185; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                            Submit
                        </button>
                    </form>
                    <a href="/delete-log/{{ u.id }}" 
                            style="padding: 10px;background-color: #2A2185;color: white;border: none;border-radius: 4px;font-size: 16px;cursor: pointer;margin-top: 20px;width: 100%;display: block;text-align: center;">
                            Delete
                    </a>
                </div>

                </div>

                <!-- ================= New Customers ================ -->                
            </div>
        </div>
    </div>

    <!-- =========== Scripts =========  -->
    <script src="/assets/js/main.js"></script>

    <!-- ====== ionicons ======= -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
