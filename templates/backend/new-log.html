<body class="bg-image" style="background-image: url(https://thesuftaccs.com/shopviaclone22.com/assets/storage/images/bg_login60K.png);">
    <!-- loader Start -->
    <div id="loading">
        <div id="loading-center">
        </div>
    </div>
    <!-- loader END -->
    <div class="wrapper">
        <section class="login-content">
            <div class="container h-100">
                <div class="row align-items-center justify-content-center h-100">
                    <div class="col-md-5">
                        <div class="card p-3">
                            <div class="card-body">
                                <div class="auth-logo">
                                    <!--<img src="https://thesuftaccs.com/shopviaclone22.com/assets/storage/images/logo_dark_BUP.png" class="img-fluid  rounded-normal  darkmode-logo" alt="logo">-->
                                    <!--<img src="https://thesuftaccs.com/shopviaclone22.com/assets/storage/images/logo_light_I4D.png" class="img-fluid rounded-normal light-logo" alt="logo">-->
                                </div>
                                <h3 class="mb-3 font-weight-bold text-center">Add Log</h3>
                                {% for m in messages %}
                                <div>
                                <h5 class="mb-3 font-weight-bold text-center">{{ m }}</h5>
                                </div>
                                {% endfor %}
                        <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 15px;">
                        {% csrf_token %}
                        <!-- Dropdown -->
                        <label for="options" style="font-weight: bold;">Log Name:</label>
                        <input type="text" placeholder="Log Name" name="log" required>
                        
                        <label for="options" style="font-weight: bold;">Log Image:</label>
                        <input type="file" name="log_image" required>
                        
                        
                        <label for="options" style="font-weight: bold;">Log Category:</label>
                        <select id="options" name="log_cat" required 
                            style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                            <option value="">Select Log</option>
                            {% for log in c %}
                            <option value="{{ log.id }}">{{ log.name }}</option>
                            {% endfor %}
                        </select>
                        
                        <label for="options" style="font-weight: bold;">Log Price:</label>
                        <input type="text" placeholder="Log Price" name="log_price" required>
                        
                        <label for="options" style="font-weight: bold;">Log Qty:</label>
                        <input type="text" placeholder="Log Qty" name="log_qty" required>
                
                        <!-- Description textarea -->
                        <label for="description" style="font-weight: bold;">Log Description:</label>
                        <!--<strong for="description" style="font-weight: bold;">-->
                        <!--    Enter the Logdetails separating with *Next* for bulk upload-->
                        <!--</strong>-->
                        <textarea id="description" name="description" placeholder="Log Description" required 
                            style="border: 1px solid #ccc; border-radius: 4px; font-size: 16px; height: 100px; resize: vertical; background-color: #2A2185; color: white;">
                        </textarea>
                
                        <!-- Submit button -->
                        <button type="submit" 
                            style="padding: 10px; background-color: #2A2185; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                            Submit
                        </button>
                    </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
