{% load static %}
<div id="main-modal-content">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
        <div class="modal-header bg-pantone">
          <h4 class="modal-title"><i class="fa fa-edit"></i> Sync Services ({{ api.name }})</h4>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"></button>
        </div>
        <form action="/admin/s2-sync/" class="form actionForm" data-redirect="/admin/provider/" method="POST" accept-charset="utf-8">
<input type="hidden" name="api_id" value="2" />
<input type="hidden" name="token" value="8bedbdd9cd9e51e20d379c5503ea337e" />           
        <div class="modal-body">
          <div class="row justify-content-md-center">
            <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="form-group">
                        <label>Price increase (Auto rounding to 2 decimal places)</label>
                        <input type="number" step="0.01" name="price_percentage_increase" value="{{ api.percentage }}" class="form-control">

                    </div>
                </div> <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="form-group">
                        <label>Synchronous request</label>
                        <select name="sync_request" class="form-control">
<option value="0" selected="selected">Only for current services</option>
<option value="1">All services</option>
</select>

                    </div>
                    
                    <div class="form-group">
                        <label>Dollar Rate</label>
                        <input type="number" name="dollar_rate" value="{{ rate }}" class="form-control">
                    </div>
                </div>  <div class="col-md-12 col-sm-12 col-xs-12">
                    <div class="form-group">
                        <div class="custom-controls-stacked">
                            <label class="form-check">
                                <input type="checkbox" name="sync_request_options[original_price]" value="1" checked="checked" class="form-check-input"  />

                                <span class="custom-control-label">&nbsp;<label>Sync Original Price</label></span>
                            </label>
                        </div>
                    </div>
                </div>  
            <div class="col-md-12">
                <span class="text-danger">Note:</span>
                <ul class="text-muted">
                    <li> Synchronous request:
                        <ol>
                            <li><strong class="text-success">Current Service</strong>: Syncing all current services available</li>
                            <li><strong class="text-success">All Services</strong>: Syncing all services available and add new service automatically if service doesn't exists</li>
                        </ol>
                    </li>
                </ul>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary btn-min-width mr-1 mb-1">Save</button>
          <button type="button" class="btn btn-dark" data-dismiss="modal">Close</button>
        </div>
        </form>    </div>
  </div>
</div>
