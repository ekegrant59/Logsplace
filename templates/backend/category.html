{% extends 'partials/backend.html' %} {% load static %} {% load humanize %} 
{% block content %}

<main class="app-content">
  <div class="page-title m-b-20">
    <div class="row justify-content-between">
      <div class="col-md-6">
        <h1 class="page-title">
          <span class="fe fe-th-large"></span> Category
        </h1>
      </div>
      <div class="col-md-6">
        <div class="d-flex">
          <a
            href="/admin/category/new"
            class="ml-auto btn btn-outline-primary ajaxModal"
          >
            <span class="fe fe-plus"></span>
            Add new
          </a>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Filter</h3>
          <div class="card-options">
            <a
              href="#"
              class="card-options-collapse"
              data-toggle="card-collapse"
              ><i class="fe fe-chevron-up"></i
            ></a>
            <a href="#" class="card-options-remove" data-toggle="card-remove"
              ><i class="fe fe-x"></i
            ></a>
          </div>
        </div>
        <div class="card-body">
          <div class="row">
            <!--<div class="col-md-8">-->
            <!--  <div class="btn-group w-30 m-b-10">-->
            <!--    <a href="/admin/category?status=2" class="btn"-->
            <!--      >All <span class="badge badge-pill bg-azure">{{ all.count }}</span></a-->
            <!--    ><a href="/admin/category?status=1" class="btn"-->
            <!--      >Active <span class="badge badge-pill bg-indigo">{{ a.count }}</span></a-->
            <!--    >-->
            <!--    <a href="/admin/category?status=0" class="btn"-->
            <!--      >Deactive <span class="badge badge-pill bg-indigo">{{ dea.count }}</span></a-->
            <!--    >-->
            <!--  </div>-->
            <!--</div>-->
            <div class="col-md-4 search-area">
              <div class="form-group">
                <div class="input-group">
                  <input
                    type="text"
                    name="query"
                    class="form-control"
                    placeholder="Search for…"
                    value=""
                  />
                  <select name="field" class="form-control" id="">
                    <option value="name">Name</option>
                  </select>
                  <button
                    class="btn btn-primary btn-square btn-search"
                    type="button"
                  >
                    <span class="fe fe-search"></span>
                  </button>
                  <button
                    class="btn btn-outline-danger btn-square btn-clear d-none"
                    data-toggle="tooltip"
                    data-placement="bottom"
                    title=""
                    data-original-title="Clear"
                    type="button"
                  >
                    <span class="fe fe-x"></span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 col-xl-12">
      <div class="card">
        <!-- Card headers -->
        <div class="card-header massAction">
          <h3 class="card-title">Lists</h3>
          <div
            class="btnActions d-none btn-group"
            role="group"
            aria-label="Basic example"
          >
            <span class="btn btn-primary m-r-2 number-items-selected">
              00 items selected</span
            >
            <div class="item-action dropdown action-options">
              <button
                type="button"
                class="btn btn-outline-primary dropdown-toggle"
                data-toggle="dropdown"
              >
                Actions <span class="fe fe-chevrons-down"></span>
              </button>
              <div class="dropdown-menu dropdown-menu-right">
                <a
                  href="/admin/category/bulk_action/active"
                  data-type="active"
                  class="dropdown-item ajaxActionOptions"
                  ><i class="dropdown-icon fe fe-check-square"></i> Active</a
                ><a
                  href="/admin/category/bulk_action/deactive"
                  data-type="deactive"
                  class="dropdown-item ajaxActionOptions"
                  ><i class="dropdown-icon fe fe-x-square"></i> Deactive All</a
                ><a
                  href="/admin/category/bulk_action/delete"
                  data-type="delete"
                  class="dropdown-item ajaxActionOptions"
                  ><i class="dropdown-icon fe fe-trash-2"></i> Delete</a
                >
              </div>
            </div>
          </div>
          <div class="card-options">
            <a
              href="#"
              class="card-options-collapse"
              data-toggle="card-collapse"
              ><i class="fe fe-chevron-up"></i
            ></a>
            <a href="#" class="card-options-remove" data-toggle="card-remove"
              ><i class="fe fe-x"></i
            ></a>
          </div>
        </div>
        <div class="table-responsive sortable-content">
          <table
            class="table table-hover table-bordered table-vcenter card-table"
            data-sort_table_url="/admin/category/sort_table"
          >
            <thead>
              <tr>
                <th class="text-center w-1"><i class="fe fe-move"></i></th>
                <th class="text-center w-1">
                  <div class="custom-controls-stacked">
                    <label class="form-check"
                      ><input
                        type="checkbox"
                        class="form-check-input check-items check-all"
                        data-name="check_1"
                      /><span class="custom-control-label"></span>
                    </label>
                  </div>
                </th>
                <th class="">Name</th>
                <!--<th class="text-center">Status</th>-->
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody class="ui-sortable">
              {% for c in cat %}
              <tr class="{{ c.id }}" data-id="{{ c.id }}">
                <td class="sort-handler w-1p ui-sortable-handle">
                  <i class="fe fe-grid"></i>
                </td>
                <td class="text-center w-1p">
                  <div class="custom-controls-stacked">
                    <label class="form-check"
                      ><input
                        type="checkbox"
                        class="form-check-input check-item check_1"
                        name="ids[]"
                        value="{{ c.id }}"
                      /><span class="custom-control-label"></span>
                    </label>
                  </div>
                </td>
                <td>
                  <div class="title">{{ c.name }}</div>
                </td>
                <!--<td class="text-center w-10p">-->
                <!--    {% if c.active == True %}-->
                <!--  <label class="custom-switch">-->
                <!--    <input-->
                <!--      type="checkbox"-->
                <!--      name="item_status"-->
                <!--      data-id="{{ c.id }}"-->
                <!--      data-status="1"-->
                <!--      data-action="/admin/category/change_status/"-->
                <!--      class="custom-switch-input ajaxToggleItemStatus"-->
                <!--      checked=""-->
                <!--    />-->
                <!--    <span class="custom-switch-indicator"></span>-->
                <!--  </label>-->
                <!--  {% else %}-->
                <!--  <label class="custom-switch">-->
                <!--    <input-->
                <!--      type="checkbox"-->
                <!--      name="item_status"-->
                <!--      data-id="{{ c.id }}"-->
                <!--      data-status="1"-->
                <!--      data-action="/admin/category/change_status/"-->
                <!--      class="custom-switch-input ajaxToggleItemStatus"-->
                <!--    />-->
                <!--    <span class="custom-switch-indicator"></span>-->
                <!--  </label>-->
                <!--  {% endif %}-->
                <!--</td>-->
                <td class="text-center w-10p">
                  <div class="item-action dropdown">
                    <a
                      href="javascript:void(0)"
                      data-toggle="dropdown"
                      class="icon"
                      ><i class="fe fe-more-vertical"></i
                    ></a>
                    <div class="dropdown-menu">
                      
                      <a
                        href="/admin/category/delete/{{ c.id }}"
                        class="dropdown-item ajaxDeleteItem"
                        data-confirm_ms="Are you sure you want to delete this item"
                        ><i class="dropdown-icon fe fe-trash-2"></i> Delete</a
                      >
                      <a
                      href="/admin/category/edit/{{ c.id }}"
                      class="btn btn-icon btn-outline-info ajaxModal"
                      data-confirm_ms=""
                      data-toggle="tooltip"
                      data-placement="bottom"
                      title=""
                      data-original-title="Edit"
                    >
                      <i class="fe fe-edit">Edit</i> </a
                    >
                    </div>
                  </div>
                </td>
              </tr>           
              {% endfor %}                
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

{% endblock content %}
